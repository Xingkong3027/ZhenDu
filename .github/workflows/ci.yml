name: Check, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhendu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release version
        run: |
          $version = python -c 'from zhendu import __version__; print(__version__)'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match application version' }
      - name: Download and verify pinned FFmpeg
        run: python tools/fetch_ffmpeg.py
      - name: Unit and isolated Windows registry checks
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Real FFmpeg integration
        run: python -B -m tests.integration work/integration
      - name: Trim, size, audio and subtitle regressions
        run: python -B -m tests.edge_integration work/edge 'work/integration/media/测试 视频 18秒.mp4'
      - name: Build Windows GUI distribution
        run: python tools/build.py
      - name: Check output setting and queued Explorer tasks
        run: python -B -m tests.ui_smoke work/ui 'work/integration/media/短片 4秒.mp4'
      - name: Test actual packaged jobs and repeated launches
        run: python -B -m tests.frozen_jobs dist/ZhenDu/ZhenDu.exe work/frozen-jobs 'work/integration/media/短片 4秒.mp4'
      - name: Test packaged task-subfolder mode
        run: python -B -m tests.frozen_jobs dist/ZhenDu/ZhenDu.exe work/frozen-folders 'work/integration/media/短片 4秒.mp4' --task-subfolders
      - name: Archive exact source and tested distribution
        run: python tools/make_release.py
      - name: Verify packaged release assets
        run: |
          $version = python -c 'from zhendu import __version__; print(__version__)'
          python tools/verify_release.py release-assets --commit $env:GITHUB_SHA --version $version
      - name: Keep tested assets
        uses: actions/upload-artifact@v4
        with:
          name: tested-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            work/integration/integration-report.json
            work/edge/edge-report.json
            work/frozen-jobs/frozen-jobs.json
            work/frozen-jobs/process.log
            work/frozen-folders/frozen-jobs.json
            work/ui/ui-report.json
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-windows-release
          path: release-assets
      - name: Check tag, source and downloaded build artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          python3 tools/verify_release.py release-assets --commit "$GITHUB_SHA" --version "$version"
      - name: Create draft, verify actual downloads, then publish
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" --json isDraft >/tmp/zhendu-existing.json 2>/tmp/zhendu-release-error; then
            python3 -c 'import json; assert json.load(open("/tmp/zhendu-existing.json"))["isDraft"], "Release is already public; refusing to replace it"'
          else
            if ! grep -q 'release not found' /tmp/zhendu-release-error; then cat /tmp/zhendu-release-error; exit 1; fi
            gh release create "$tag" --verify-tag --draft --title "帧渡 ZhenDu $version" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          mkdir draft-downloads
          gh release download "$tag" --dir draft-downloads
          python3 tools/verify_release.py draft-downloads --commit "$GITHUB_SHA" --version "$version"
          gh release edit "$tag" --draft=false --latest --title "帧渡 ZhenDu $version" --notes-file RELEASE_NOTES.md
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName
